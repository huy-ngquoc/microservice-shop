<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MSShop Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        
        <div class="text-center mb-8">
            <span class="text-4xl">👕</span>
            <h1 class="text-2xl font-bold text-gray-900 mt-3 tracking-tight">Welcome to MSShop</h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to access your AI Smart Consultant Dashboard</p>
        </div>

        <div id="alert-box" class="hidden mb-6 p-4 rounded-lg text-sm font-medium"></div>

        <form id="login-form" class="space-y-5">
            
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
                <div class="relative">
                    <input type="text" id="username" required placeholder="Enter your username"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="Enter your password"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center text-gray-500 cursor-pointer">
                    <input type="checkbox" class="rounded-sm border-gray-300 text-indigo-600 focus:ring-indigo-500 mr-1.5">
                    Remember me
                </label>
                <a href="#" class="text-indigo-600 font-medium hover:underline">Forgot password?</a>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition-colors shadow-sm focus:outline-hidden focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center justify-center gap-2">
                <span id="btn-text">Sign In</span>
                <div id="btn-spinner" class="hidden animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
            </button>

        </form>

        <div class="text-center mt-8 pt-4 border-t border-gray-100">
            <p class="text-xs text-gray-400">MSShop Enterprise Security • Thesis Demo Mode</p>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const alertBox = document.getElementById('alert-box');

        const GATEWAY_URL = 'http://localhost:8082'; // API Gateway Single Entrypoint

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop standard form submission reload

            // Reset UI states
            showAlert('', 'hide');
            setLoading(true);

            const payload = {
                username: usernameInput.value.trim(),
                password: passwordInput.value
            };

            try {
                // Execute POST request to API Gateway endpoint
                const response = await fetch(`${GATEWAY_URL}/account/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Authentication failed. Please check credentials.');
                }

                // Verify token presence inside Keycloak JSON signature
                if (data.access_token) {
                    showAlert('Success! Redirecting to dashboard...', 'success');
                    
                    // Store token securely in Browser LocalStorage
                    localStorage.setItem('ms_access_token', data.access_token);
                    if (data.refresh_token) {
                        localStorage.setItem('ms_refresh_token', data.refresh_token);
                    }

                    // Optional: Automatically redirect to your variant dashboard after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html'; 
                    }, 1500);
                } else {
                    throw new Error('Access token not found in authentication response.');
                }

            } catch (error) {
                console.error('Login error:', error);
                showAlert(error.message, 'error');
                setLoading(false);
            }
        });

        // Helper function to manage loading micro-interactions
        function setLoading(isLoading) {
            btnSubmit.disabled = isLoading;
            if (isLoading) {
                btnSpinner.classList.remove('hidden');
                btnText.textContent = 'Authenticating...';
                btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                btnSpinner.classList.add('hidden');
                btnText.textContent = 'Sign In';
                btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        // Helper function to handle notification responses cleanly
        function showAlert(message, type) {
            alertBox.className = "mb-6 p-4 rounded-lg text-sm font-medium"; // clear
            if (type === 'hide') {
                alertBox.classList.add('hidden');
                return;
            }
            
            alertBox.classList.remove('hidden');
            alertBox.textContent = message;

            if (type === 'success') {
                alertBox.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-100');
            } else if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-100');
            }
        }
    </script>
</body>
</html>
