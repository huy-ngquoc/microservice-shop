[project]
name = "ml-service"
version = "0.1.0"
description = "HTTP inference server (gender + body shape) for recommendation-service"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.12.1",
    "torchvision==0.27.1",
    "timm==1.0.27",
    "tensorflow==2.21.0",
    "numpy==2.2.6",
    "pillow==12.3.0",
]

[tool.uv]
package = false

# Force CPU wheels for torch/torchvision -- the default PyPI build pulls in the whole CUDA runtime.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
